services:
  postgres:
    image: postgres:15
    container_name: shopbot-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: shopbot-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        pip install --quiet --no-cache-dir psycopg2-binary &&
        mlflow db upgrade postgresql://mlflow:mlflow@postgres:5432/mlflow_db &&
        mlflow server \
          --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow_db \
          --default-artifact-root /mlflow/artifacts \
          --host 0.0.0.0 \
          --port 5001
    ports:
      - "5001:5001"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  mlflow-artifacts:

networks:
  default:
    name: shopbot-network
