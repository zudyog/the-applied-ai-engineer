<svg viewBox="0 0 280 448" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap');</style>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1A32"/>
      <stop offset="0.55" stop-color="#06101E"/>
      <stop offset="1" stop-color="#030810"/>
    </linearGradient>
    <pattern id="grid1" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="20" height="20" rx="2" fill="none" stroke="#00C8FF" stroke-width="0.4" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="280" height="448" fill="url(#bg1)"/>
  <rect width="280" height="448" fill="url(#grid1)"/>
  <rect x="1" y="1" width="278" height="446" fill="none" stroke="#00C8FF" stroke-width="0.6" opacity="0.3"/>

  <text x="20" y="24" fill="#00C8FF" font-size="7" font-family="Jost,sans-serif" font-weight="400" letter-spacing="2">RAG MASTERY</text>
  <text x="20" y="34" fill="#6888A8" font-size="5.5" font-family="Jost,sans-serif" font-weight="300" letter-spacing="1.5">THE RAG MASTERY SERIES</text>
  <g fill="#00C8FF" opacity="0.4">
    <circle cx="20" cy="46" r="1"/><circle cx="42" cy="46" r="1"/><circle cx="64" cy="46" r="1"/><circle cx="86" cy="46" r="1"/>
    <circle cx="108" cy="46" r="1"/><circle cx="130" cy="46" r="1"/><circle cx="152" cy="46" r="1"/><circle cx="174" cy="46" r="1"/>
    <circle cx="196" cy="46" r="1"/><circle cx="218" cy="46" r="1"/><circle cx="240" cy="46" r="1"/>
  </g>

  <text x="20" y="105" fill="#C8E8F0" font-size="24" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="500">No.<tspan fill="#00C8FF" font-size="46" font-style="normal" font-weight="700"> 1</tspan></text>

  <text x="20" y="152" fill="#E8F4F8" font-size="26" font-family="Cormorant Garamond,serif" font-weight="700" letter-spacing="0.5">The AI</text>
  <text x="20" y="186" fill="#E8F4F8" font-size="26" font-family="Cormorant Garamond,serif" font-weight="700" letter-spacing="0.5">Engineer</text>

  <line x1="20" y1="200" x2="90" y2="200" stroke="#00C8FF" stroke-width="1"/>

  <text x="20" y="218" fill="#7BAFD4" font-size="12" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="500">Build a Production RAG System</text>
  <text x="20" y="233" fill="#7BAFD4" font-size="12" font-family="Cormorant Garamond,serif" font-style="italic" font-weight="500">with Python, LangChain, and ChromaDB</text>

  <!-- Icon: context docs fed into grounding layer, answer out -->
  <g transform="translate(140,279)">
    <line x1="-22" y1="-12" x2="-4" y2="-12" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
    <line x1="-22" y1="-5" x2="-4" y2="-5" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
    <line x1="-22" y1="2" x2="-4" y2="2" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
    <line x1="-4" y1="-5" x2="2" y2="-5" stroke="#00C8FF" stroke-width="1"/>
    <rect x="2" y="-14" width="20" height="18" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.4"/>
    <line x1="5" y1="-9" x2="19" y2="-9" stroke="#FFFFFF" stroke-width="0.7" opacity="0.5"/>
    <line x1="5" y1="-4" x2="19" y2="-4" stroke="#FFFFFF" stroke-width="0.7" opacity="0.5"/>
    <line x1="5" y1="1" x2="14" y2="1" stroke="#FFFFFF" stroke-width="0.7" opacity="0.5"/>
    <line x1="12" y1="4" x2="12" y2="14" stroke="#00C8FF" stroke-width="1.2"/>
    <polygon points="9,13 15,13 12,18" fill="#00C8FF"/>
  </g>

  <!-- Pramana mark: triangle (syllogistic structure) + circle (evidence) + dot (answer) -->
  <g transform="translate(45,333)">
    <path d="M0,-16 L15,11 L-15,11 Z" fill="none" stroke="#00C8FF" stroke-width="0.9" opacity="0.85"/>
    <circle cx="0" cy="2" r="6" fill="none" stroke="#00C8FF" stroke-width="0.9" opacity="0.9"/>
    <circle cx="0" cy="2" r="2" fill="#00C8FF" opacity="0.9"/>
  </g>
  <text x="80" y="339" fill="#C8E8F0" font-size="7" font-family="Jost,sans-serif" font-weight="400" letter-spacing="1.5">GROUNDING LAYER</text>
  <text x="80" y="349" fill="#6888A8" font-size="6" font-family="Jost,sans-serif" font-weight="300" letter-spacing="1">RETRIEVE · GROUND · ANSWER</text>

  <line x1="20" y1="396" x2="260" y2="396" stroke="#00C8FF" stroke-width="0.4" opacity="0.3"/>
  <text x="140" y="412" text-anchor="middle" fill="#E8F4F8" font-size="8" font-family="Jost,sans-serif" font-weight="400" letter-spacing="2.5">BALAJI RAJE HAMBEERE</text>
  <g fill="#00C8FF" opacity="0.4">
    <circle cx="20" cy="430" r="1"/><circle cx="42" cy="430" r="1"/><circle cx="64" cy="430" r="1"/><circle cx="86" cy="430" r="1"/>
    <circle cx="108" cy="430" r="1"/><circle cx="130" cy="430" r="1"/><circle cx="152" cy="430" r="1"/><circle cx="174" cy="430" r="1"/>
    <circle cx="196" cy="430" r="1"/><circle cx="218" cy="430" r="1"/><circle cx="240" cy="430" r="1"/>
  </g>
  <circle cx="129.5" cy="440" r="2.5" fill="#00C8FF"/>
  <circle cx="136.5" cy="440" r="1.5" fill="none" stroke="#00C8FF" stroke-width="0.5" opacity="0.4"/>
  <circle cx="143.5" cy="440" r="1.5" fill="none" stroke="#00C8FF" stroke-width="0.5" opacity="0.4"/>
  <circle cx="150.5" cy="440" r="1.5" fill="none" stroke="#00C8FF" stroke-width="0.5" opacity="0.4"/>
</svg>
