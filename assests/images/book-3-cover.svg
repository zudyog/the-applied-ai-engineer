  <circle cx="129.5" cy="440" r="1.5" fill="none" stroke="#00C8FF" stroke-width="0.5" opacity="0.4"/>
  <circle cx="136.5" cy="440" r="1.5" fill="none" stroke="#00C8FF" stroke-width="0.5" opacity="0.4"/>
  <circle cx="143.5" cy="440" r="2.5" fill="#00C8FF"/>
  <circle cx="150.5" cy="440" r="1.5" fill="none" stroke="#00C8FF" stroke-width="0.5" opacity="0.4"/>
